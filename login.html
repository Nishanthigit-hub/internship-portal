<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Internship Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-page">

    <div class="login-card">

        <div class="brand card-header">
            <div class="brand-icon">🎓</div>
            <h1>Login Here</h1>
            <p>Welcome back! Login to continue.</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-icon-field">
                    <span>📧</span>
                    <input type="email" id="loginEmail"
                           placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-icon-field">
                    <span>🔒</span>
                    <input type="password" id="loginPassword"
                           placeholder="Enter your password" required>
                </div>
            </div>

           <div class="login-options">
    <!-- Pointing to a file that doesn't exist -->
    <a href="forgot-password.html" id="forgotPassword">Forgot Password?</a>
</div>

            <button type="submit" class="submit-btn">
                Login →
            </button>

            <p class="bottom-text">
                Don't have an account?
                <a href="registration.html">Register here</a>
            </p>

        </form>

    </div>

</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        alert(
            "Login successful!\nWelcome! Let's get your journey started\n\n" +
            "This is a frontend demo. Actual login authentication is not connected yet."
        );
    });

   
</script>

</body>
</html>
